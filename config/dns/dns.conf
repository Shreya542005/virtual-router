# DNS service on the virtual router
interface=ap0
listen-address=192.168.50.1
bind-dynamic
port=53

# Upstream DNS servers
no-resolv
server=1.1.1.1
server=8.8.8.8

# DNS caching
cache-size=1000

# DNS protection
domain-needed
bogus-priv
local-service

# Local DNS record
local=/router.lan/
address=/router.lan/192.168.50.1
